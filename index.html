
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steel Protocol</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; background: rgba(0, 0, 0, 0.85);
            color: #00f3ff; pointer-events: auto; z-index: 10;
        }
        .hidden { display: none; }
        button {
            padding: 15px 30px; font-size: 20px; font-family: 'Courier New';
            background: transparent; color: #00f3ff; border: 2px solid #00f3ff;
            cursor: pointer; margin: 10px; transition: 0.3s;
        }
        button:hover { background: #00f3ff; color: #000; box-shadow: 0 0 20px #00f3ff; }
        #status-text { font-size: 48px; margin-bottom: 10px; text-shadow: 0 0 10px #ff003c; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="menu" class="screen">
            <h1>STEEL PROTOCOL</h1>
            <p>SELECT DIFFICULTY</p>
            <button onclick="startGame('easy')">EASY</button>
            <button onclick="startGame('normal')">NORMAL</button>
            <button onclick="startGame('hard')">HARD</button>
        </div>

        <!-- End Screen Overlay -->
        <div id="overlay" class="screen hidden">
            <h1 id="status-text">SYSTEM OFFLINE</h1>
            <p>REBOOT REQUIRED TO CONTINUE</p>
            <button onclick="rebootGame()">REBOOT SYSTEM</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
